services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    expose:
      - "8080"
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_BASE_URL: http://api:8080
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped
