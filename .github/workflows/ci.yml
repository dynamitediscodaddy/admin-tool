name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: ./mvnw -B verify
        working-directory: apps/api
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.1
      - run: bash infra/aws/tests/deploy.sh
      - run: terraform fmt -check -recursive infra/aws
      - run: for script in infra/aws/*.sh; do bash -n "$script"; done
      - run: terraform -chdir=infra/aws/bootstrap init -backend=false -input=false
      - run: terraform -chdir=infra/aws/bootstrap validate
      - run: terraform -chdir=infra/aws/bootstrap test
      - run: terraform -chdir=infra/aws/terraform init -backend=false -input=false
      - run: terraform -chdir=infra/aws/terraform validate
      - run: terraform -chdir=infra/aws/terraform test
